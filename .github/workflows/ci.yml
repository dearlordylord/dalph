name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-plan:
    name: Classify change and resolve supported Node versions
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.change.outputs.base-sha }}
      head-sha: ${{ steps.change.outputs.head-sha }}
      docs-only: ${{ steps.change.outputs.docs-only }}
      formal-required: ${{ steps.change.outputs.formal-required }}
      formal-classification: ${{ steps.change.outputs.formal-classification }}
      versions: ${{ steps.versions.outputs.versions }}
      quality-stages: ${{ steps.quality_plan.outputs.expected-cells }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Node versions from package engines
        id: versions
        run: |
          node -e '
            const ranges = require("./package.json").engines.node.split(" || ")
            if (ranges.some((range) => !/^\^\d+\.\d+\.\d+$/.test(range))) {
              throw new Error("engines.node must contain caret minimums separated by ` || `")
            }
            const versions = ranges.map((range) => range.slice(1))
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `versions=${JSON.stringify(versions)}\n`)
          '

      - name: Classify the exact changed paths
        id: change
        env:
          DALPH_CI_EVENT_NAME: ${{ github.event_name }}
          DALPH_CI_HEAD_SHA: ${{ github.sha }}
          DALPH_CI_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DALPH_CI_PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: node scripts/classify-docs-only-change.mjs

      - name: Generate hosted quality suffix matrix from the stage algebra
        id: quality_plan
        run: node scripts/quality-gate-stage-plan.mjs --base "${{ steps.change.outputs.base-sha }}" --candidate "${{ steps.change.outputs.head-sha }}" --github-output "$GITHUB_OUTPUT"

  docs-quality:
    name: Documentation-only quality gate
    needs: change-plan
    if: needs.change-plan.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DALPH_DOCS_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: bash scripts/install-gitleaks.sh

      - name: Check the documentation change
        run: |
          git diff --check "$DALPH_DOCS_BASE_SHA" "$GITHUB_SHA" --
          node --test scripts/classify-docs-only-change.test.mjs
          gitleaks git --redact --no-banner --log-opts="$DALPH_DOCS_BASE_SHA..$GITHUB_SHA"

  quality-preflight:
    name: Hosted quality preflight (Node ${{ matrix.node-version }})
    needs: change-plan
    if: needs.change-plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # The preflight census runs all independent structural checks before any
    # qualification cell is admitted.
    timeout-minutes: 80
    env:
      DALPH_COVERAGE_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}
      NODE_OPTIONS: --max-old-space-size=8192

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.change-plan.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: bash scripts/install-gitleaks.sh

      - name: Run hosted quality preflight
        run: pnpm check:ci:quality:preflight --candidate="${{ needs.change-plan.outputs.base-sha }}"

  quality-suffix:
    name: Hosted quality ${{ matrix.stageId }} (Node ${{ matrix.nodeVersion }})
    needs: [change-plan, quality-preflight]
    if: needs.change-plan.outputs.docs-only != 'true' && needs.quality-preflight.result == 'success'
    runs-on: ubuntu-latest
    # Five minutes for install, five for artifact preparation, twenty for
    # coverage, five seconds for termination grace, two for process absence,
    # and setup/export/upload reserve.
    timeout-minutes: 35
    env:
      DALPH_HOSTED_QUALITY_CANDIDATE_SHA: ${{ needs.change-plan.outputs.head-sha }}
      DALPH_HOSTED_QUALITY_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}
      DALPH_HOSTED_QUALITY_WORKFLOW: ${{ github.workflow }}
      DALPH_HOSTED_QUALITY_RUN_ID: ${{ github.run_id }}
      DALPH_HOSTED_QUALITY_RUN_ATTEMPT: ${{ github.run_attempt }}
      DALPH_HOSTED_QUALITY_NODE_VERSION: ${{ matrix.nodeVersion }}
      DALPH_HOSTED_QUALITY_STAGE_ID: ${{ matrix.stageId }}
      DALPH_COVERAGE_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}
      NODE_OPTIONS: --max-old-space-size=8192

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.change-plan.outputs.quality-stages) }}

    steps:
      - name: Record hosted suffix cell start
        run: echo "DALPH_HOSTED_QUALITY_CELL_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.nodeVersion }}

      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile

      # The checked-in stage algebra requires clean runners to reconstruct the
      # production dist trees used by coverage and other package consumers.
      # This is bounded preparation, not a second structural preflight.
      - name: Prepare production artifacts
        timeout-minutes: 5
        run: pnpm check:artifacts

      # Real-process custody is deliberately fail-closed when any process with
      # the caller's effective UID cannot be inspected. GitHub's shared runner
      # account owns unrelated service processes, so the coverage cell gets a
      # fresh UID whose complete process population belongs to this command.
      - name: Prepare isolated coverage account
        if: matrix.stageId == 'coverage'
        run: |
          echo "QUALITY_WORKSPACE_OWNER=$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
          echo "QUALITY_PNPM_HOME=/opt/dalph-quality-pnpm/node_modules/.bin" >> "$GITHUB_ENV"
          mkdir -p "hosted-quality/stages/${{ matrix.nodeVersion }}/${{ matrix.stageId }}"
          sudo useradd --create-home --shell /bin/bash dalph-quality
          sudo cp -a "$(dirname "$(dirname "$PNPM_HOME")")" /opt/dalph-quality-pnpm
          sudo chmod -R a+rX /opt/dalph-quality-pnpm
          sudo setfacl -m u:dalph-quality:--x \
            "$(dirname "$(dirname "$(dirname "$GITHUB_WORKSPACE")")")" \
            "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" \
            "$(dirname "$GITHUB_WORKSPACE")"
          sudo chown -R dalph-quality:dalph-quality "$GITHUB_WORKSPACE"

      # The stage command emits its ordinary pass/fail envelope and exits zero
      # after an ordinary stage verdict. Export/ownership failures remain
      # nonzero so the aggregate reports that cell as unproven.
      - name: Run hosted quality stage
        run: |
          stage_command=(pnpm check:ci:quality:stage \
            --stage "${{ matrix.stageId }}" \
            --base "${{ needs.change-plan.outputs.base-sha }}" \
            --candidate "${{ needs.change-plan.outputs.head-sha }}" \
            --node-version "${{ matrix.nodeVersion }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --output "hosted-quality/stages/${{ matrix.nodeVersion }}/${{ matrix.stageId }}")
          if [[ "${{ matrix.stageId }}" == coverage ]]; then
            sudo -H -u dalph-quality env -i \
              "HOME=/home/dalph-quality" \
              "PATH=$QUALITY_PNPM_HOME:$PATH" \
              "CI=$CI" \
              "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
              "GITHUB_SHA=$GITHUB_SHA" \
              "NODE_OPTIONS=$NODE_OPTIONS" \
              "DALPH_HOSTED_QUALITY_CANDIDATE_SHA=$DALPH_HOSTED_QUALITY_CANDIDATE_SHA" \
              "DALPH_HOSTED_QUALITY_BASE_SHA=$DALPH_HOSTED_QUALITY_BASE_SHA" \
              "DALPH_HOSTED_QUALITY_WORKFLOW=$DALPH_HOSTED_QUALITY_WORKFLOW" \
              "DALPH_HOSTED_QUALITY_RUN_ID=$DALPH_HOSTED_QUALITY_RUN_ID" \
              "DALPH_HOSTED_QUALITY_RUN_ATTEMPT=$DALPH_HOSTED_QUALITY_RUN_ATTEMPT" \
              "DALPH_HOSTED_QUALITY_NODE_VERSION=$DALPH_HOSTED_QUALITY_NODE_VERSION" \
              "DALPH_HOSTED_QUALITY_STAGE_ID=$DALPH_HOSTED_QUALITY_STAGE_ID" \
              "DALPH_HOSTED_QUALITY_CELL_STARTED_AT=$DALPH_HOSTED_QUALITY_CELL_STARTED_AT" \
              "DALPH_COVERAGE_BASE_SHA=$DALPH_COVERAGE_BASE_SHA" \
              "${stage_command[@]}"
          else
            mkdir -p "hosted-quality/stages/${{ matrix.nodeVersion }}/${{ matrix.stageId }}"
            "${stage_command[@]}"
          fi

      - name: Restore coverage workspace ownership
        if: always() && matrix.stageId == 'coverage'
        run: |
          sudo chown -R "$QUALITY_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          sudo rm -rf /opt/dalph-quality-pnpm
          sudo setfacl -x u:dalph-quality \
            "$(dirname "$(dirname "$(dirname "$GITHUB_WORKSPACE")")")" \
            "$(dirname "$(dirname "$GITHUB_WORKSPACE")")" \
            "$(dirname "$GITHUB_WORKSPACE")"
          sudo userdel --remove dalph-quality

      # This step must run after an ordinary command failure so the aggregate
      # can distinguish a failed stage from a missing/unproven stage.
      - name: Upload hosted quality stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-quality-stage-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.nodeVersion }}-${{ matrix.stageId }}
          path: hosted-quality/stages/${{ matrix.nodeVersion }}/${{ matrix.stageId }}
          if-no-files-found: error
          retention-days: 1

  quality-aggregate:
    name: Hosted quality gate
    needs: [change-plan, docs-quality, quality-preflight, quality-suffix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DALPH_HOSTED_QUALITY_CANDIDATE_SHA: ${{ needs.change-plan.outputs.head-sha }}
      DALPH_HOSTED_QUALITY_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}
      DALPH_HOSTED_QUALITY_WORKFLOW: ${{ github.workflow }}
      DALPH_HOSTED_QUALITY_RUN_ID: ${{ github.run_id }}
      DALPH_HOSTED_QUALITY_RUN_ATTEMPT: ${{ github.run_attempt }}
      DALPH_HOSTED_QUALITY_NODE_VERSIONS: ${{ needs.change-plan.outputs.versions }}
      DALPH_HOSTED_QUALITY_STAGE_PLAN: ${{ needs.change-plan.outputs.quality-stages }}
      DALPH_COVERAGE_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}

    steps:
      - name: Refuse failed change plan
        if: needs.change-plan.result != 'success'
        run: |
          printf 'Hosted quality change plan did not succeed; refusing a successful required check.\n' >&2
          exit 1

      - name: Report documentation-only quality result
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.docs-only == 'true'
        run: |
          if [ "${{ needs.docs-quality.result }}" != success ]; then
            printf 'Documentation-only quality gate did not succeed; refusing a successful aggregate.\n' >&2
            exit 1
          fi
          printf 'Hosted comprehensive quality suffix not applicable for this documentation-only change.\n'

      - name: Checkout
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.docs-only != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.docs-only != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.docs-only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(needs.change-plan.outputs.versions)[0] }}

      - name: Download hosted quality stage evidence
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.docs-only != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: hosted-quality-stage-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: hosted-quality/stages

      - name: Aggregate every expected hosted quality result
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.docs-only != 'true'
        run: |
          mapfile -t reports < <(find hosted-quality/stages -type f -name envelope.json -print 2>/dev/null | sort)
          pnpm check:ci:quality:aggregate \
            --base "$DALPH_HOSTED_QUALITY_BASE_SHA" \
            --candidate "$DALPH_HOSTED_QUALITY_CANDIDATE_SHA" \
            --run-id "$DALPH_HOSTED_QUALITY_RUN_ID" \
            --run-attempt "$DALPH_HOSTED_QUALITY_RUN_ATTEMPT" \
            -- "${reports[@]}"

      - name: Upload hosted quality aggregate evidence
        id: hosted_quality_evidence
        if: always() && needs.change-plan.result == 'success' && needs.change-plan.outputs.docs-only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-quality-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-quality/stages
          if-no-files-found: warn
          retention-days: 1

      - name: Report hosted quality evidence location
        if: always() && steps.hosted_quality_evidence.outputs.artifact-url != ''
        env:
          DALPH_HOSTED_QUALITY_EVIDENCE_URL: ${{ steps.hosted_quality_evidence.outputs.artifact-url }}
        run: |
          printf 'Hosted quality evidence: %s\n' "$DALPH_HOSTED_QUALITY_EVIDENCE_URL"
          printf 'Hosted quality evidence: %s\n' "$DALPH_HOSTED_QUALITY_EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"

  formal-models:
    name: Formal model shard ${{ matrix.shard }} (Node ${{ matrix.node-version }})
    needs: change-plan
    if: needs.change-plan.outputs.formal-required == 'true'
    runs-on: ubuntu-24.04-arm
    # quint-gate-policy.mjs checks this literal against 720s execution + 7s
    # termination + 210s setup/reporting reserve < this 960s outer cutoff.
    timeout-minutes: 16
    env:
      DALPH_FORMAL_COMMIT_SHA: ${{ github.sha }}
      DALPH_FORMAL_NODE_VERSION: ${{ matrix.node-version }}
      NODE_OPTIONS: --max-old-space-size=8192

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.change-plan.outputs.versions) }}
        shard: [0, 1]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run formal model shard
        run: pnpm check:ci:formal:shard --shard "${{ matrix.shard }}" --report "formal-shard-reports/shard-${{ matrix.shard }}.json"

      - name: Upload formal model shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: formal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node-version }}-${{ matrix.shard }}
          path: formal-shard-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  formal-model-aggregate:
    name: Formal model gate (Node ${{ matrix.node-version }})
    needs: [change-plan, formal-models]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DALPH_FORMAL_COMMIT_SHA: ${{ github.sha }}
      DALPH_FORMAL_NODE_VERSION: ${{ matrix.node-version }}
      DALPH_FORMAL_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}
      DALPH_FORMAL_HEAD_SHA: ${{ needs.change-plan.outputs.head-sha }}
      DALPH_FORMAL_CLASSIFICATION: ${{ needs.change-plan.outputs.formal-classification }}

    strategy:
      fail-fast: false
      matrix:
        # The literal fallback creates the required failing check when
        # change-plan cannot publish outputs. The CI contract keeps it equal to
        # package.json; successful plans still supply the authoritative matrix.
        node-version: ${{ fromJSON(needs.change-plan.outputs.versions || '["24.20.0"]') }}

    steps:
      - name: Refuse failed change plan
        if: needs.change-plan.result != 'success'
        run: |
          printf 'Formal model change plan did not succeed; refusing a successful required check.\n' >&2
          exit 1

      - name: Checkout
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.formal-required == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.formal-required == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download formal model shard evidence
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.formal-required == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: formal-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.node-version }}-*
          path: formal-shard-reports
          merge-multiple: true

      - name: Validate complete formal model evidence
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.formal-required == 'true'
        run: node scripts/aggregate-hosted-formal-shards.mjs formal-shard-reports/shard-0.json formal-shard-reports/shard-1.json

      - name: Report formal model gate not applicable
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.formal-required == 'false'
        run: |
          printf 'Formal model gate not applicable.\n'
          printf 'Base SHA: %s\n' "$DALPH_FORMAL_BASE_SHA"
          printf 'Head SHA: %s\n' "$DALPH_FORMAL_HEAD_SHA"
          printf 'Classification: %s\n' "$DALPH_FORMAL_CLASSIFICATION"

      - name: Refuse missing formal classification
        if: needs.change-plan.result == 'success' && needs.change-plan.outputs.formal-required != 'true' && needs.change-plan.outputs.formal-required != 'false'
        run: |
          printf 'Formal model classification is missing; refusing a successful required check.\n' >&2
          exit 1
