name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-plan:
    name: Classify change and resolve supported Node versions
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.change.outputs.base-sha }}
      docs-only: ${{ steps.change.outputs.docs-only }}
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read Node versions from package engines
        id: versions
        run: |
          node -e '
            const ranges = require("./package.json").engines.node.split(" || ")
            if (ranges.some((range) => !/^\^\d+\.\d+\.\d+$/.test(range))) {
              throw new Error("engines.node must contain caret minimums separated by ` || `")
            }
            const versions = ranges.map((range) => range.slice(1))
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `versions=${JSON.stringify(versions)}\n`)
          '

      - name: Classify the exact changed paths
        id: change
        env:
          DALPH_CI_EVENT_NAME: ${{ github.event_name }}
          DALPH_CI_HEAD_SHA: ${{ github.sha }}
          DALPH_CI_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DALPH_CI_PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: node scripts/classify-docs-only-change.mjs

  docs-quality:
    name: Documentation-only quality gate
    needs: change-plan
    if: needs.change-plan.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DALPH_DOCS_BASE_SHA: ${{ needs.change-plan.outputs.base-sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: bash scripts/install-gitleaks.sh

      - name: Check the documentation change
        run: |
          git diff --check "$DALPH_DOCS_BASE_SHA" "$GITHUB_SHA" --
          node --test scripts/classify-docs-only-change.test.mjs
          gitleaks git --redact --no-banner --log-opts="$DALPH_DOCS_BASE_SHA..$GITHUB_SHA"

  quality:
    name: Comprehensive quality gate (Node ${{ matrix.node-version }})
    needs: change-plan
    if: needs.change-plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pull requests compare with the target branch tip; pushes compare with
    # the event's previous commit so the changed-line verifier includes the
    # committed change and any worktree changes produced by the gate.
    env:
      DALPH_COVERAGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      NODE_OPTIONS: --max-old-space-size=8192

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.change-plan.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: bash scripts/install-gitleaks.sh

      # Quint-connected MBT remains in the local pnpm check:all gate. The
      # complete formal model gate runs in the separate matrix below so this
      # quality job stays independently runnable.
      - name: Run CI quality gate
        run: pnpm check:ci:quality

  formal-models:
    name: Formal model gate (Node ${{ matrix.node-version }})
    needs: change-plan
    if: needs.change-plan.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # The gate's inner deadline is 600s. The 16-minute job bound reserves the
    # measured frozen-install time plus a 300s checkout/action/network margin
    # and still leaves a small final-reporting margin.
    timeout-minutes: 16
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.change-plan.outputs.versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete formal model gate
        run: pnpm check:quint
