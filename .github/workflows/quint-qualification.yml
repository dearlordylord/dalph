name: Temporary hermetic CI full-gate qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: check-all-qualification-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    env:
      DALPH_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DALPH_COVERAGE_BASE_SHA: f22b14fd00411e75de0762b9deacc9fba644cb9a
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Validate candidate SHA
        run: '[[ "$DALPH_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Verify candidate and record worker
        run: |
          test "$(git rev-parse HEAD)" = "$DALPH_CANDIDATE_SHA"
          git rev-parse HEAD
          uname -m
          lscpu

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unchanged final full gate
        run: pnpm check:all
