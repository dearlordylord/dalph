name: Cassette performance measurement

on:
  push:
    branches:
      - perf/cassette-measurement
  workflow_dispatch:

concurrency:
  group: cassette-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-capstone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24.20.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Record runner metadata
        run: |
          mkdir -p benchmark-results
          lscpu --json > benchmark-results/lscpu.json
          node --version > benchmark-results/node-version.txt
          pnpm --version > benchmark-results/pnpm-version.txt
          git rev-parse HEAD > benchmark-results/commit.txt

      - name: Warm focused cassette path
        run: >-
          pnpm exec vitest run
          packages/dalph/test/cassettes/authored-delivery-status.test.ts
          -t 'authored capstone carries exact canonical status'
          --pool=forks
          --no-file-parallelism

      - name: Measure five isolated focused runs
        run: |
          for run in 1 2 3 4 5; do
            /usr/bin/time \
              -f '%e' \
              -o "benchmark-results/wall-${run}.txt" \
              pnpm exec vitest run \
                packages/dalph/test/cassettes/authored-delivery-status.test.ts \
                -t 'authored capstone carries exact canonical status' \
                --pool=forks \
                --no-file-parallelism \
                --reporter=json \
                --outputFile="benchmark-results/vitest-${run}.json"
          done

      - name: Summarize measurements
        run: |
          node -e '
            const fs = require("node:fs")
            const values = Array.from({ length: 5 }, (_, index) =>
              Number(fs.readFileSync(`benchmark-results/wall-${index + 1}.txt`, "utf8").trim())
            )
            const sorted = [...values].sort((left, right) => left - right)
            const summary = {
              unit: "seconds",
              wall: values,
              min: sorted[0],
              median: sorted[Math.floor(sorted.length / 2)],
              max: sorted.at(-1)
            }
            fs.writeFileSync("benchmark-results/summary.json", `${JSON.stringify(summary, null, 2)}\n`)
            console.log(JSON.stringify(summary, null, 2))
          '

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassette-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 7
