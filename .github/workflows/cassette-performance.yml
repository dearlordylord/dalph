name: Cassette performance measurement

on:
  push:
    branches:
      - perf/cassette-measurement
  workflow_dispatch:

concurrency:
  group: cassette-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused-capstone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24.20.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Record runner metadata
        run: |
          mkdir -p benchmark-results
          lscpu --json > benchmark-results/lscpu.json
          node --version > benchmark-results/node-version.txt
          pnpm --version > benchmark-results/pnpm-version.txt
          git rev-parse HEAD > benchmark-results/commit.txt

      - name: Measure instrumented focused run
        run: |
          /usr/bin/time \
            -f '%e' \
            -o benchmark-results/instrumented-wall.txt \
            pnpm exec vitest run \
              packages/dalph/test/cassettes/authored-delivery-status.test.ts \
              -t 'authored capstone carries exact canonical status' \
              --pool=forks \
              --no-file-parallelism \
            2>&1 | tee benchmark-results/instrumented.log

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassette-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results
          if-no-files-found: warn
          retention-days: 7
